[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arboris"
version = "0.0.1"
description = "Arboris — graph-based dendritic model, an alternative approach to world models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Adam Pippert", email = "adam.pippert@gmail.com" }]
keywords = ["world-models", "graph-neural-network", "dendritic", "representation-learning", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AdamPippert/Arboris"
Repository = "https://github.com/AdamPippert/Arboris"
"Model Card" = "https://huggingface.co/CoastalDigitalResearch/Arboris"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
